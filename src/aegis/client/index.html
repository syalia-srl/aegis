<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="aegis-build" content="__AEGIS_BUILD__">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="__AEGIS_PREFIX__/manifest.webmanifest">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="__AEGIS_PREFIX__/static/icons/aegis-192.png">
<title>aegis</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/css/fonts.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/css/page.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/css/client.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/vendor/xterm/xterm.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/ink.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/logbook.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/electric.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/phosphor.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/blueprint.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/amphora.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/riso.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/solari.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/aizome.css">
<link rel="stylesheet" href="__AEGIS_PREFIX__/static/themes/poster.css">
<script>
// The theme once called syalia is electric now.
if (localStorage.getItem("aegis.theme") === "syalia") localStorage.setItem("aegis.theme", "electric");
document.documentElement.dataset.theme = localStorage.getItem("aegis.theme") || "ink";
</script>
</head>
<body>
<div id="a2" class="app aegis" data-theme="ink" data-layout="full" data-view="boot"></div>
<!-- The full layout's behaviour, named ahead of the mount so the page's load
     event still waits for it, as it did when this page was that module's own
     entry. The mount loads it by itself too; a chat host never pays for it. -->
<script type="module" src="__AEGIS_PREFIX__/static/js/app.js"></script>
<script type="module">
  // The page is one full mount: it owns the document, the root above and the
  // socket. The mount builds the layout's markup and has app.js compose it.
  import { mount } from "__AEGIS_PREFIX__/static/js/mount.js";
  // The page's outbox is outbox.js's singleton (the queued row and the browser
  // suite call it by that name), handed to the mount that owns its flush.
  import { outbox } from "__AEGIS_PREFIX__/static/js/outbox.js";
  mount(document.getElementById("a2"), {
    adopt: true, // the div above is the root, not a host element to fill
    layout: "full",
    outbox,
    page: true, // the mount owns the document: title, hash, worker, push
    theme: localStorage.getItem("aegis.theme") || document.documentElement.dataset.theme || "ink",
    lang: new URLSearchParams(location.search).get("lang") || localStorage.getItem("aegis.lang") || "en",
  });
</script>
</body>
</html>
