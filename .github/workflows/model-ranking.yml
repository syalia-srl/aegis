name: model-ranking

on:
  schedule:
    - cron: "17 4 * * *" # Benchmark API: once per day.
    - cron: "17 0-3,5-23 * * *" # Public provider prices and free offers: hourly.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the refreshed snapshot
        type: boolean
        default: true
      catalog_only:
        description: Refresh offers without calling the benchmark API
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: model-ranking

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Install, one paginated fetch and a push: about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: harnesses
        if: github.event.schedule != '17 0-3,5-23 * * *' && !inputs.catalog_only
        run: |
          npm install --prefix "$RUNNER_TEMP/npm" --no-fund --no-audit --silent \
            @anthropic-ai/claude-code@latest @opencode/cli@latest
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: refresh
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          CATALOG_ONLY: ${{ github.event.schedule == '17 0-3,5-23 * * *' || inputs.catalog_only }}
        run: |
          base=src/aegis/data/models.json
          if git fetch --depth 1 origin model-ranking; then
            git show FETCH_HEAD:models.json > "$RUNNER_TEMP/base-models.json"
            base="$RUNNER_TEMP/base-models.json"
          fi
          args=()
          if [ "$CATALOG_ONLY" = true ]; then
            args+=(--catalog-only)
          fi
          uv run scripts/refresh-model-ranking "${args[@]}" \
            --base "$base" --out "$RUNNER_TEMP/models.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        with:
          name: model-catalog-preview
          path: ${{ runner.temp }}/models.json
      - name: publish
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin model-ranking; then
            git switch -C model-ranking FETCH_HEAD
          else
            git switch --orphan model-ranking
            git rm -rfq . || true
          fi
          git clean -fdxq
          cp "$RUNNER_TEMP/models.json" models.json
          git add models.json
          if git diff --cached --quiet; then
            echo "unchanged"
          else
            git commit -qm "chore(ranking): refresh $(date -u +%FT%TZ)"
            git push origin model-ranking
          fi
          echo "$(jq '(.offers // {}) | length' models.json) provider offers, $(jq '[.models[] | select(.intelligence != null)] | length' models.json) models scored"
